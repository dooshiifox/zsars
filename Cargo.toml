[package]
name = "zsars"
version = "0.1.1"
edition = "2024"
description = "Connect to a ZSA keyboard and send & receive events"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dooshiifox/zsars"
keywords = ["keyboard", "zsa"]
exclude = [".envrc", "flake.nix", "flake.lock"]

[lib]

[dependencies]
hidapi = "2.6.7"
thiserror = "2.0.21"

[dev-dependencies]
ctrlc = "3.5.3"

[[example]]
name = "connect"

[[example]]
name = "readme"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
